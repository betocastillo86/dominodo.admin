<div class="container-xl">
  <!-- `ms-auto`: this block is the container's only child, so Tabler's
       `justify-content: space-between` would leave it on the left edge. -->
  <div class="navbar-nav flex-row order-md-last align-items-center ms-auto">
    <span class="nav-item small text-secondary d-none d-md-inline me-3" title="Versión instalada">
      v{{ versions.currentVersion }}
    </span>
    <div class="nav-item" ngbDropdown placement="bottom-end">
      <a
        class="nav-link d-flex lh-1 text-reset p-0"
        role="button"
        ngbDropdownToggle
        id="user-menu"
      >
        <span class="avatar avatar-sm">
          <tabler-icon name="user-circle"></tabler-icon>
        </span>
        <div class="d-none d-xl-block ps-2">
          <div>{{ store.user()?.id ?? 'Administrador' }}</div>
          <div class="mt-1 small text-secondary">
            {{ (store.user()?.roles ?? []).join(', ') }}
          </div>
        </div>
      </a>
      <div ngbDropdownMenu class="dropdown-menu dropdown-menu-end" aria-labelledby="user-menu">
        <button type="button" class="dropdown-item" (click)="logout()">
          <tabler-icon name="logout" class="me-2"></tabler-icon>
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
</div>
