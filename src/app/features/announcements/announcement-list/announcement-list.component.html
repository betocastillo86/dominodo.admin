<app-page-header title="Anuncios" pretitle="Administración">
  <a routerLink="/announcements/new" actions class="btn btn-primary">+ Nuevo anuncio</a>
</app-page-header>

<div class="page-body">
  <div class="card">
    <div class="card-header">
      <div class="row g-2">
        <div class="col-12 col-sm-6 col-lg-3">
          <select class="form-select" [formControl]="statusControl">
            <option value="">Todos los estados</option>
            <option value="Draft">Borrador</option>
            <option value="Published">Publicado</option>
            <option value="Archived">Archivado</option>
          </select>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <select class="form-select" [formControl]="priorityControl">
            <option value="">Todas las prioridades</option>
            <option value="High">Alta</option>
            <option value="Medium">Media</option>
            <option value="Low">Baja</option>
          </select>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <app-multi-select
            [formControl]="categoryControl"
            [options]="categoryOptions()"
            placeholder="Todas las categorías"
            emptyText="No hay categorías disponibles"
          />
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <select class="form-select" [formControl]="tenantControl">
            <option value="">Todos los conjuntos</option>
            @for (tenant of tenants(); track tenant.id) {
              <option [value]="tenant.id">{{ tenant.name }}</option>
            }
          </select>
        </div>
      </div>
    </div>
    <app-data-table
      [columns]="columns()"
      [rows]="announcements()"
      [paging]="paging()"
      [loading]="loading()"
      [error]="error()"
      [rowKey]="rowKey"
      [actionLink]="editLink"
      (pageChange)="onPageChange($event)"
    />
  </div>
</div>
