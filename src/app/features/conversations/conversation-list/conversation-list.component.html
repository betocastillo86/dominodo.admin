<app-page-header title="Conversaciones" pretitle="Domi" />

<div class="page-body">
  <div class="card">
    <div class="card-header">
      <div class="row g-2 w-100">
        <div class="col-12 col-sm-6 col-lg-4">
          <input
            type="text"
            class="form-control"
            placeholder="Buscar por teléfono…"
            [formControl]="phoneControl"
          />
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
          <select class="form-select" [formControl]="tenantControl">
            <option value="">Todos los conjuntos</option>
            @for (t of tenants(); track t.id) {
              <option [value]="t.slug">{{ t.name }}</option>
            }
          </select>
        </div>
        <div class="col-6 col-sm-6 col-lg-2">
          <input type="date" class="form-control" [formControl]="fromControl" aria-label="Desde" />
        </div>
        <div class="col-6 col-sm-6 col-lg-2">
          <input type="date" class="form-control" [formControl]="toControl" aria-label="Hasta" />
        </div>
      </div>
    </div>
    <app-data-table
      [columns]="columns()"
      [rows]="conversations()"
      [paging]="paging()"
      [loading]="loading()"
      [error]="error()"
      [rowKey]="rowKey"
      [actionLink]="detailLink"
      actionIcon="eye"
      (pageChange)="onPageChange($event)"
    />
  </div>
</div>
