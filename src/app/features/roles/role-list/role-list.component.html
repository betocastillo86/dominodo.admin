<app-page-header title="Roles" pretitle="Administración">
  <a routerLink="/roles/new" actions class="btn btn-primary">+ Nuevo rol</a>
</app-page-header>

<div class="page-body">
  <div class="card">
    <div class="card-header">
      <div class="row g-2">
        <div class="col-12 col-sm-6 col-lg-6">
          <input
            type="text"
            class="form-control"
            placeholder="Buscar por nombre…"
            [formControl]="nameControl"
          />
        </div>
        <div class="col-12 col-sm-4 col-lg-6">
          <select class="form-select" [formControl]="scopeControl">
            <option value="">Todos los scopes</option>
            <option value="Platform">Plataforma</option>
            <option value="Tenant">Tenant</option>
          </select>
        </div>
      </div>
    </div>
    <app-data-table
      [columns]="columns"
      [rows]="roles()"
      [paging]="paging()"
      [loading]="loading()"
      [error]="error()"
      [rowKey]="rowKey"
      [actionLink]="editLink"
      (pageChange)="onPageChange($event)"
    />
  </div>
</div>
