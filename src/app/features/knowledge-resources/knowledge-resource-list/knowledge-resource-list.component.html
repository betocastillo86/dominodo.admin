<app-page-header title="Base de conocimiento" pretitle="Administración">
  <a routerLink="/knowledge-resources/new" actions class="btn btn-primary">+ Nuevo recurso</a>
</app-page-header>

<div class="page-body">
  <div class="card">
    <div class="card-header">
      <div class="row g-2">
        <div class="col-12 col-sm-4 col-lg-4">
          <select class="form-select" [formControl]="statusControl">
            <option value="">Todos los estados</option>
            <option value="Draft">Borrador</option>
            <option value="Published">Publicado</option>
            <option value="Archived">Archivado</option>
          </select>
        </div>
        <div class="col-12 col-sm-4 col-lg-4">
          <input
            type="text"
            class="form-control"
            placeholder="Buscar…"
            [formControl]="searchControl"
          />
        </div>
        <div class="col-12 col-sm-4 col-lg-4">
          <select class="form-select" [formControl]="tenantControl">
            <option value="">Todos los conjuntos</option>
            @for (tenant of tenants(); track tenant.id) {
              <option [value]="tenant.id">{{ tenant.name }}</option>
            }
          </select>
        </div>
      </div>
    </div>
    <app-data-table
      [columns]="columns()"
      [rows]="resources()"
      [paging]="paging()"
      [loading]="loading()"
      [error]="error()"
      [rowKey]="rowKey"
      [actionLink]="editLink"
      [actionQueryParams]="editQueryParams"
      (pageChange)="onPageChange($event)"
    />
  </div>
</div>
