<app-page-header title="Correos" pretitle="Notificaciones" />

<div class="page-body">
  <div class="card">
    <div class="card-header">
      <div class="row g-2 w-100">
        <div class="col-12 col-sm-6 col-lg-4">
          <input
            type="text"
            class="form-control"
            placeholder="Buscar por asunto o cuerpo…"
            [formControl]="searchControl"
          />
        </div>
        <div class="col-12 col-sm-6 col-lg-2">
          <input
            type="text"
            class="form-control"
            placeholder="Destinatario"
            [formControl]="recipientControl"
          />
        </div>
        <div class="col-12 col-sm-4 col-lg-2">
          <select class="form-select" [formControl]="statusControl">
            <option value="">Todos los estados</option>
            @for (status of statuses; track status) {
              <option [value]="status">{{ statusLabels[status] }}</option>
            }
          </select>
        </div>
        <div class="col-6 col-sm-4 col-lg-2">
          <input type="date" class="form-control" [formControl]="fromControl" aria-label="Desde" />
        </div>
        <div class="col-6 col-sm-4 col-lg-2">
          <input type="date" class="form-control" [formControl]="toControl" aria-label="Hasta" />
        </div>
      </div>
    </div>
    <app-data-table
      [columns]="columns"
      [rows]="messages()"
      [paging]="paging()"
      [loading]="loading()"
      [error]="error()"
      [rowKey]="rowKey"
      (pageChange)="onPageChange($event)"
    />
  </div>
</div>
