<app-page-header title="En la app" pretitle="Notificaciones" />

<div class="page-body">
  <div class="card">
    <div class="card-header">
      <div class="row g-2 w-100">
        <div class="col-12 col-sm-6 col-lg-4">
          <input
            type="text"
            class="form-control"
            placeholder="Buscar por título o mensaje…"
            [formControl]="searchControl"
          />
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
          <input
            type="text"
            class="form-control"
            placeholder="ID de usuario"
            [formControl]="recipientUserIdControl"
          />
        </div>
        <div class="col-6 col-sm-6 col-lg-2">
          <input type="date" class="form-control" [formControl]="fromControl" aria-label="Desde" />
        </div>
        <div class="col-6 col-sm-6 col-lg-2">
          <input type="date" class="form-control" [formControl]="toControl" aria-label="Hasta" />
        </div>
      </div>
    </div>
    <app-data-table
      [columns]="columns"
      [rows]="messages()"
      [paging]="paging()"
      [loading]="loading()"
      [error]="error()"
      [rowKey]="rowKey"
      (pageChange)="onPageChange($event)"
    />
  </div>
</div>
